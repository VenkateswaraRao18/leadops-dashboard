services:
  - type: web
    name: leadops-api
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: POSTGRES_URL
        fromDatabase:
          name: leadops-db
          property: connectionString
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: leadops-dashboard
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: leadops-db
    databaseName: lead_ops
    plan: free
    region: oregon
